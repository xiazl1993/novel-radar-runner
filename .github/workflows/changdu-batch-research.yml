name: changdu-batch-research

on:
  schedule:
    # Monday / Thursday 09:30 Asia/Shanghai.
    - cron: '30 1 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel-radar-production-changdu
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private Novel Radar core
        uses: actions/checkout@v4
        with:
          repository: xiazl1993/novel-radar
          ref: refactor/public-runner-cutover
          token: ${{ secrets.NOVEL_RADAR_CORE_TOKEN }}
          path: core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install private core
        run: pip install -e ./core

      - name: Collect curated short stories
        working-directory: core
        env:
          NOVEL_RADAR_DATABASE_URL: ${{ secrets.NOVEL_RADAR_DATABASE_URL }}
        run: python scripts/run_public_runner_task.py changdu
