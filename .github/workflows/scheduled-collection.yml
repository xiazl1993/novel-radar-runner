name: scheduled-collection

on:
  schedule:
    # 00:20 / 06:20 / 12:20 / 18:20 Asia/Shanghai.
    - cron: '20 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel-radar-production-rankings
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private Novel Radar core
        uses: actions/checkout@v4
        with:
          repository: xiazl1993/novel-radar
          ref: refactor/public-runner-cutover
          token: ${{ secrets.NOVEL_RADAR_CORE_TOKEN }}
          path: core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install private core
        run: pip install -e ./core

      - name: Collect public rankings
        working-directory: core
        env:
          NOVEL_RADAR_DATABASE_URL: ${{ secrets.NOVEL_RADAR_DATABASE_URL }}
          NOVEL_RADAR_CATEGORY_BATCH_SIZE: '20'
          NOVEL_RADAR_RANK_LIMIT: '100'
        run: python scripts/run_public_runner_task.py rankings
