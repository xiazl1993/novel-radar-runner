name: verify-private-access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-private-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOVEL_RADAR_DATABASE_URL: ${{ secrets.NOVEL_RADAR_DATABASE_URL }}
    steps:
      - name: Require configured secrets
        shell: bash
        env:
          CORE_TOKEN: ${{ secrets.NOVEL_RADAR_CORE_TOKEN }}
        run: |
          test -n "$CORE_TOKEN"
          test -n "$NOVEL_RADAR_DATABASE_URL"
          echo "required secrets are present"

      - name: Checkout private Novel Radar core
        uses: actions/checkout@v4
        with:
          repository: xiazl1993/novel-radar
          ref: refactor/public-runner-cutover
          token: ${{ secrets.NOVEL_RADAR_CORE_TOKEN }}
          path: core
          persist-credentials: false

      - name: Validate production datastore secret
        shell: bash
        run: |
          python core/scripts/validate_database_target.py "$NOVEL_RADAR_DATABASE_URL" >/dev/null
          echo "private core access and production datastore secret validated"
