name: private-core-ci

on:
  schedule:
    # Daily 08:10 Asia/Shanghai.
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel-radar-private-core-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private Novel Radar core
        uses: actions/checkout@v4
        with:
          repository: xiazl1993/novel-radar
          ref: refactor/public-runner-cutover
          token: ${{ secrets.NOVEL_RADAR_CORE_TOKEN }}
          path: core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install private core
        run: pip install -e './core[dev]'

      - name: Ruff
        working-directory: core
        run: ruff check src tests scripts

      - name: CLI wiring
        working-directory: core
        run: novel-radar collect-changdu-short-story --help

      - name: Pytest
        working-directory: core
        run: pytest -q
